# Creavix iT — Cloudflare Workers (static assets from Astro dist)
name = "creavix"
compatibility_date = "2024-11-01"

# Workers static assets (NOT pages_build_output_dir)
# Build: npm run build → ./dist
# Deploy: npx wrangler deploy
[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto"
