name: Validate Creavix build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: creavix-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify Creavix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Astro production assets
        run: npm run build

      - name: Verify routes
        run: npm run verify:routes

      - name: Verify reviews
        run: npm run verify:reviews

      - name: Verify premium upgrade
        run: npm run verify:premium

      - name: Verify mobile and desktop performance safeguards
        run: npm run verify:performance

      - name: Verify interactive AI tool explorer
        run: npm run verify:ai-tools

      - name: Verify Creavix recovery integrity
        run: npm run verify:integrity

      - name: Validate Cloudflare Worker bundle
        run: npm run verify:cloudflare
